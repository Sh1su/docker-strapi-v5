###########
# ENV VARS:
# - DOCKER_USERNAME
# - DOCKER_PASSWORD
# - GITHUB_TOKEN (default)
###########

name: Publish Docker Image

on:
  # Manual trigger: rebuild/republish the version in release-versions/strapi-latest.txt
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'release-versions/*'

# Least privilege: only the GitHub release step needs write access
permissions:
  contents: write

# Never run two publishes at once (auto + manual release)
concurrency:
  group: publish-docker-images
  cancel-in-progress: false

jobs:
  build:
    # Only publish from main, also for manual runs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:

      - name: Get current repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Get the version
        id: vars
        run: |
          set -euo pipefail
          TAG=$(cat release-versions/strapi-latest.txt)
          # Fail before any credentials are used if the version is not a single semver token
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version in release-versions/strapi-latest.txt"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (default => debian)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./images/strapi-debian
          build-args: |
            STRAPI_VERSION=${{steps.vars.outputs.tag}}
            NODE_VERSION=22
          # platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/strapi:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/strapi:latest

      - name: Build (alpine)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./images/strapi-alpine
          build-args: |
            STRAPI_VERSION=${{ steps.vars.outputs.tag }}
            NODE_VERSION=22
          # platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/strapi:${{ steps.vars.outputs.tag }}-alpine
            ${{ secrets.DOCKER_USERNAME }}/strapi:latest-alpine

      - name: Docker Hub Description (README.md)
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: sh1su/strapi
          readme-filepath: README.md

      - name: Create Release in GitHub
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v${{steps.vars.outputs.tag}}
          name: Release ${{steps.vars.outputs.tag}}
          body: strapi v${{steps.vars.outputs.tag}}
