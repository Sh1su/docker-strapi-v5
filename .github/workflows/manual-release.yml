###################
# ENV VARS:
# - PAT (generated at Personal Access Tokens - with workflow access checked)
###################

name: Create new release manually

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version'
        required: true
        default: '4.0.0'
        type: string

# The push is authenticated with the PAT, GITHUB_TOKEN only needs read access
permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.PAT }}

      - name: Fetch release version
        id: fetch-version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          printf '%s\n' "$VERSION" > release-versions/strapi-latest.txt

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: New manual release ${{ github.event.inputs.version }}
