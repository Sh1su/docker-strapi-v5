###################
# ENV VARS:
# - PAT (generated at Personal Access Tokens - with workflow access checked)
###################

name: Check for new releases
# Check automatically for new releases (new version)

on:
  schedule:
    - cron: "0 0 */1 * *"
  workflow_dispatch:

# The push is authenticated with the PAT, GITHUB_TOKEN only needs read access
permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.PAT }}

      - name: Fetch release version
        id: fetch-version
        run: |
          set -euo pipefail
          FILE=release-versions/strapi-latest.txt
          CURRENT=$(cat "$FILE")
          LATEST=$(curl -fsSL https://raw.githubusercontent.com/strapi/strapi/main/packages/core/strapi/package.json | jq -r ".version")

          # Only accept stable semver releases
          if ! [[ "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::Ignoring non-stable or invalid upstream version: $LATEST"
            LATEST="$CURRENT"
          fi

          # Never downgrade the published version
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n 1)
          if [ "$HIGHEST" != "$LATEST" ]; then
            echo "::warning::Upstream version $LATEST is lower than current $CURRENT, keeping current"
            LATEST="$CURRENT"
          fi

          printf '%s\n' "$LATEST" > "$FILE"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: New auto release v${{steps.fetch-version.outputs.version}}
